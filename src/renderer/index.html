<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' data:; font-src 'self' data:; worker-src 'self' blob: data:">
  <title>Harbor</title>
  <link rel="stylesheet" data-name="vs/editor/editor.main" href="../../node_modules/monaco-editor/min/vs/editor/editor.main.css">
  <link rel="stylesheet" href="../../node_modules/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="devBanner" class="drag" hidden>DEV</div>
  <div id="app">
    <aside id="sidebar">
      <div class="side-head drag">
        <span class="brand no-drag" title="Drag to move the sidebar to the other side"><img src="../../assets/logo-512.png" width="18" height="18" alt="">Harbor</span>
        <button id="addRepo" class="icon-btn no-drag" title="Add repository">
          <svg viewBox="0 0 16 16" width="14" height="14"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="side-label">Workspaces</div>
      <div id="repos"></div>
      <div class="side-foot">
        <button id="settingsBtn" class="link-btn">Settings</button>
        <span id="envNote"></span>
      </div>
    </aside>

    <main id="main">
      <div id="panes">
        <section id="workspace">
          <div id="layoutRoot"></div>
          <div id="edStatus" hidden></div>
        </section>
        <div id="treeSplit" class="vsplit"></div>
        <div id="treePane">
          <div class="tree-head" title="Drag to move the file tree to the other side"><span id="treeTitle"></span>
            <span class="tree-tabs"><button data-v="files" class="on">Files</button><button data-v="changes">Source<span id="chgStat" hidden></span></button></span>
          </div>
          <div id="tree"></div>
          <div id="commitBox" hidden>
            <textarea id="commitMsg" rows="1" placeholder="Message (cmd+enter to commit)" spellcheck="false"></textarea>
            <button id="commitBtn" disabled>Commit</button>
          </div>
          <div id="changes" hidden></div>
        </div>
      </div>
    </main>
  </div>

  <div id="modalBack" class="overlay" hidden>
    <form id="wtForm" class="modal" autocomplete="off">
      <h2>New worktree</h2>
      <label id="repoRow">Repository
        <select id="wtRepo"></select>
      </label>
      <label>Branch
        <input id="wtBranch" placeholder="feature/thing" spellcheck="false" required>
      </label>
      <label><span>Base <span class="muted">— only used if the branch is new</span></span>
        <input id="wtBase" spellcheck="false">
      </label>
      <label class="check"><input type="checkbox" id="wtAgent" checked> Start an agent in it</label>
      <div class="err" id="wtErr"></div>
      <div class="modal-actions">
        <button type="button" id="wtCancel" class="ghost-btn">Cancel</button>
        <button type="submit" id="wtOk" class="primary-btn">Create</button>
      </div>
    </form>
  </div>

  <div id="quickBack" class="overlay" hidden>
    <div class="quick">
      <input id="quickInput" placeholder="Switch to worktree…" spellcheck="false">
      <div id="quickList" class="qlist"></div>
    </div>
  </div>

  <div id="paletteBack" class="overlay" hidden>
    <div class="quick">
      <input id="paletteInput" placeholder="Go to file…   (name:line works too; type > for commands)" spellcheck="false">
      <div id="paletteList" class="qlist"></div>
    </div>
  </div>

  <div id="termHold" hidden></div>
  <div id="ctxMenu" hidden></div>
  <div id="toasts"></div>

  <!-- xterm.js (UMD) must load before Monaco's AMD loader, or it registers as an AMD module -->
  <script src="../../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="../../node_modules/@xterm/addon-webgl/lib/addon-webgl.js"></script>
  <script src="../../node_modules/monaco-editor/min/vs/loader.js"></script>
  <script src="../../vendor/rich.js"></script>
  <script src="themes.js"></script>
  <script src="fileicons/map.js"></script>
  <script src="dnd.js"></script>
  <script src="layout.js"></script>
  <script src="debug.js"></script>
  <script src="editor.js"></script>
  <script src="app.js"></script>
</body>
</html>
