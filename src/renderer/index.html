<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' data:; font-src 'self' data:; worker-src 'self' blob: data:">
  <title>Tawny</title>
  <link rel="stylesheet" data-name="vs/editor/editor.main" href="../../node_modules/monaco-editor/min/vs/editor/editor.main.css">
  <link rel="stylesheet" href="../../node_modules/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="devBanner" class="drag" hidden>DEV</div>
  <div id="app">
    <aside id="sidebar">
      <div class="side-head drag">
      </div>
      <div class="side-label" title="Drag to move the sidebar to the other side">Workspaces
        <button id="addRepo" class="icon-btn" title="New workspace">
          <svg viewBox="0 0 16 16" width="14" height="14"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div id="repos"></div>
      <div class="side-foot">
        <button id="settingsBtn" class="link-btn">Settings</button>
        <span id="envNote"></span>
      </div>
    </aside>

    <main id="main">
      <div id="panes">
        <section id="workspace">
          <div id="layoutRoot"></div>
          <div id="edStatus" hidden></div>
          <div id="pageBar" hidden></div>
        </section>
        <div id="treeSplit" class="vsplit"></div>
        <div id="treePane">
          <div class="tree-tabs" id="treeRail">
            <button data-v="files" class="on" title="Files"><svg viewBox="0 0 16 16"><path d="M3.5 1.5h6l3 3v10h-9z M9.5 1.5v3h3 M5.5 8h5 M5.5 10.5h5" fill="none" stroke="currentColor" stroke-linejoin="round"/></svg></button>
            <button data-v="changes" title="Source"><svg viewBox="0 0 16 16"><circle cx="4.5" cy="3.5" r="1.7" fill="none" stroke="currentColor"/><circle cx="4.5" cy="12.5" r="1.7" fill="none" stroke="currentColor"/><circle cx="11.5" cy="5.5" r="1.7" fill="none" stroke="currentColor"/><path d="M4.5 5.2v5.6 M11.5 7.2c0 2.3-2.5 2.3-6 3.3" fill="none" stroke="currentColor"/></svg></button>
            <button data-v="find" title="Find"><svg viewBox="0 0 16 16"><circle cx="6.5" cy="6.5" r="4" fill="none" stroke="currentColor"/><path d="M9.5 9.5l4.5 4.5" fill="none" stroke="currentColor" stroke-linecap="round"/></svg></button>
          </div>
          <div id="treeCol">
          <div class="tree-head" title="Drag to move the file tree to the other side">
            <span id="treeTitle">Files</span><span id="chgStat" hidden></span>
          </div>
          <div id="tree"></div>
          <div id="commitBox" hidden>
            <textarea id="commitMsg" rows="1" placeholder="Message (cmd+enter to commit)" spellcheck="false"></textarea>
            <button id="commitBtn" disabled>Commit</button>
          </div>
          <div id="changes" hidden></div>
          <div id="find" hidden>
            <div class="fd-form">
              <div class="fd-row">
                <button id="fdRepToggle" class="fd-chev" title="Toggle Replace"></button>
                <div class="fd-fields">
                  <div class="fd-field"><input id="fdQuery" placeholder="Find" spellcheck="false" autocomplete="off"><span class="fd-opts"><button data-o="matchCase" title="Match Case (cmd+option+c)">Aa</button><button data-o="wholeWord" title="Match Whole Word (cmd+option+w)"><u>ab</u></button><button data-o="regex" title="Use Regular Expression (cmd+option+r)">.*</button></span></div>
                  <div class="fd-field" id="fdRepField" hidden><input id="fdReplace" placeholder="Replace" spellcheck="false" autocomplete="off"><span class="fd-opts"><button id="fdReplaceAll" title="Replace All (enter)"></button></span></div>
                </div>
              </div>
              <button id="fdDetailsBtn" class="fd-dots" title="Toggle Search Details (cmd+shift+j)">⋯</button>
              <div id="fdDetails" hidden>
                <label>files to include<input id="fdInc" placeholder="e.g. *.ts, src/**" spellcheck="false" autocomplete="off"></label>
                <label>files to exclude<input id="fdExc" placeholder="e.g. **/*.test.ts" spellcheck="false" autocomplete="off"></label>
              </div>
              <div id="fdErr" hidden></div>
            </div>
            <div id="fdSummary"><span id="fdCount"></span><span class="fd-acts"><button id="fdRefresh" title="Refresh"></button><button id="fdClear" title="Clear Results"></button><button id="fdCollapse" title="Collapse All"></button></span></div>
            <div id="fdResults" tabindex="0"></div>
          </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <footer id="statusBar">
    <div class="sb-side"></div>
    <div class="sb-side">
      <button id="portBtn" class="sb-item" title="Ports" aria-expanded="false"><span class="sb-icon"></span><span class="sb-count">0</span></button>
      <button id="resBtn" class="sb-item" title="Resource Manager" aria-expanded="false"><span class="sb-icon"></span><span class="sb-text">…</span><span class="sb-sep">·</span><span class="tglyph">&gt;_</span><span class="sb-count">0</span></button>
    </div>
  </footer>

  <div id="resPop" hidden>
    <div class="res-head"><span>Resource Manager</span><button id="resRefresh" class="icon-btn" title="Refresh"></button></div>
    <div class="res-total" id="resTotal"></div>
    <div class="rr res-cols"><span>Name</span><span></span><span class="num">CPU</span><span class="num">Memory</span><span></span></div>
    <div id="resList"></div>
    <div class="rr res-app"><span class="rr-name"><span class="ind"></span><span class="rr-label">Tawny</span></span><span></span><span id="resApp" class="res-app-nums"></span></div>
  </div>

  <div id="portPop" hidden>
    <div class="res-head"><span class="port-title"><span class="sb-icon"></span>Ports</span><span id="portSummary" class="port-summary"></span></div>
    <div id="portList"></div>
  </div>

  <div id="modalBack" class="overlay" hidden>
    <form id="wtForm" class="modal" autocomplete="off">
      <h2>New worktree</h2>
      <label id="repoRow">Repository
        <select id="wtRepo"></select>
      </label>
      <label>Branch
        <input id="wtBranch" placeholder="feature/thing" spellcheck="false" required>
      </label>
      <label><span>Base <span class="muted">— only used if the branch is new</span></span>
        <input id="wtBase" spellcheck="false">
      </label>
      <label class="check"><input type="checkbox" id="wtAgent" checked> Start an agent in it</label>
      <div class="err" id="wtErr"></div>
      <div class="modal-actions">
        <button type="button" id="wtCancel" class="ghost-btn">Cancel</button>
        <button type="submit" id="wtOk" class="primary-btn">Create</button>
      </div>
    </form>
  </div>

  <div id="quickBack" class="overlay" hidden>
    <div class="quick">
      <input id="quickInput" placeholder="Switch to worktree…" spellcheck="false">
      <div id="quickList" class="qlist"></div>
    </div>
  </div>

  <div id="paletteBack" class="overlay" hidden>
    <div class="quick">
      <div id="paletteTabs"><button data-mode="file">Files</button><button data-mode="cmd">Commands</button><button data-mode="text">Text</button><span>← → switch</span></div>
      <input id="paletteInput" placeholder="Go to file…" spellcheck="false">
      <div id="paletteOpts" hidden>
        <div class="po-row">
          <button id="poRepToggle" class="fd-chev" title="Toggle Replace (cmd+shift+h)"></button>
          <span class="fd-opts"><button data-po="matchCase" title="Match Case (cmd+option+c)">Aa</button><button data-po="wholeWord" title="Match Whole Word (cmd+option+w)"><u>ab</u></button><button data-po="regex" title="Use Regular Expression (cmd+option+r)">.*</button></span>
          <button id="poDetailsBtn" class="po-dots" title="Toggle Search Details (cmd+shift+j)">⋯</button>
          <span class="po-hint">cmd+option+f: open in sidebar</span>
        </div>
        <div class="fd-field" id="poRepField" hidden><input id="poReplace" placeholder="Replace   (enter: replace all, cmd+enter: replace selected)" spellcheck="false" autocomplete="off"></div>
        <div id="poDetails" hidden>
          <div class="fd-field"><input id="poInc" placeholder="files to include, e.g. *.ts, src/**" spellcheck="false" autocomplete="off"></div>
          <div class="fd-field"><input id="poExc" placeholder="files to exclude, e.g. **/*.test.ts" spellcheck="false" autocomplete="off"></div>
        </div>
      </div>
      <div id="paletteList" class="qlist"></div>
    </div>
  </div>

  <div id="sendBack" class="overlay" hidden>
    <div class="quick sendbox">
      <div class="send-head">
        <span id="sendRef"></span>
        <span id="sendAgent" hidden><i class="sdot"></i><span id="sendAgentName"></span><kbd>shift+tab</kbd></span>
      </div>
      <textarea id="sendInput" rows="4" placeholder="Message to agent…" spellcheck="false"></textarea>
      <div class="send-actions">
        <button id="sendCancel" class="send-btn">Cancel</button>
        <button id="sendGo" class="send-btn go">Send <span>⌘↵</span></button>
      </div>
    </div>
  </div>

  <div id="termHold" hidden></div>
  <div id="ctxMenu" hidden></div>
  <div id="toasts"></div>

  <!-- xterm.js (UMD) must load before Monaco's AMD loader, or it registers as an AMD module -->
  <script src="../../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="../../node_modules/@xterm/addon-webgl/lib/addon-webgl.js"></script>
  <script src="../../node_modules/monaco-editor/min/vs/loader.js"></script>
  <script src="../../vendor/rich.js"></script>
  <script src="../../vendor/chat.js"></script>
  <script src="../main/chat-model.js"></script>
  <script src="themes.js"></script>
  <script src="fileicons/map.js"></script>
  <script src="dnd.js"></script>
  <script src="statusbar.js"></script>
  <script src="layout.js"></script>
  <script src="debug.js"></script>
  <script src="editor.js"></script>
  <script src="chat.js"></script>
  <script src="find.js"></script>
  <script src="app.js"></script>
</body>
</html>
